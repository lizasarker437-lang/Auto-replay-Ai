name: Single-File Android APK Builder

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Generate Project Files & Source Code
        run: |
          mkdir -p app/src/main/java/com/example/waautoreply

          cat << 'EOF' > settings.gradle
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "WAAutoReply"
          include ':app'
          EOF

          cat << 'EOF' > build.gradle
          plugins {
              id 'com.android.application' version '8.2.0' apply false
              id 'org.jetbrains.kotlin.android' version '1.9.20' apply false
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
              id 'com.android.application'
              id 'org.jetbrains.kotlin.android'
          }

          android {
              namespace 'com.example.waautoreply'
              compileSdk 34

              defaultConfig {
                  applicationId "com.example.waautoreply"
                  minSdk 26
                  targetSdk 34
                  versionCode 1
                  versionName "1.0"
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
              kotlinOptions {
                  jvmTarget = '17'
              }
          }

          dependencies {
              implementation 'androidx.core:core-ktx:1.12.0'
              implementation 'androidx.appcompat:appcompat:1.6.1'
              implementation 'com.google.android.material:material:1.11.0'
              implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.example.waautoreply">

              <uses-permission android:name="android.permission.INTERNET" />

              <application
                  android:allowBackup="true"
                  android:label="WA AI AutoReply"
                  android:supportsRtl="true"
                  android:theme="@style/Theme.AppCompat.Light.DarkActionBar">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".WhatsAppListener"
                      android:exported="true"
                      android:label="WA AI Reply Service"
                      android:permission="android.permission.BIND_NOTIFICATION_LISTENER_SERVICE">
                      <intent-filter>
                          <action android:name="android.service.notification.NotificationListenerService" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/waautoreply/MainActivity.kt
          package com.example.waautoreply

          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.*
          import androidx.appcompat.app.AppCompatActivity

          class MainActivity : AppCompatActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val prefs = getSharedPreferences("BotConfig", Context.MODE_PRIVATE)

                  val scrollView = ScrollView(this)
                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(48, 48, 48, 48)
                  }

                  val statusSwitch = Switch(this).apply {
                      text = "অটো-রিপ্লাই চালু করুন"
                      textSize = 18f
                      isChecked = prefs.getBoolean("enabled", false)
                  }

                  val apiKeyInput = EditText(this).apply {
                      hint = "Gemini API Key দিন"
                      setText(prefs.getString("apiKey", ""))
                  }

                  val targetInput = EditText(this).apply {
                      hint = "টার্গেট নাম (কমা দিয়ে লিখুন, যেমন: Rahim, Karim)"
                      setText(prefs.getString("targets", ""))
                  }

                  val promptInput = EditText(this).apply {
                      hint = "AI নির্দেশনা (System Prompt)"
                      setText(prefs.getString("systemPrompt", "তুমি আমার হয়ে হোয়াটসঅ্যাপে রিপ্লাই দিচ্ছ। খুব স্বাভাবিক ও সংক্ষিপ্ত বাংলায় উত্তর দেবে যাতে মনে হয় মানুষ কথা বলছে।"))
                      minLines = 3
                  }

                  val saveBtn = Button(this).apply {
                      text = "সেটিংস সেভ করুন"
                      setOnClickListener {
                          prefs.edit()
                              .putBoolean("enabled", statusSwitch.isChecked)
                              .putString("apiKey", apiKeyInput.text.toString().trim())
                              .putString("targets", targetInput.text.toString().trim())
                              .putString("systemPrompt", promptInput.text.toString().trim())
                              .apply()
                          Toast.makeText(this@MainActivity, "সেভ হয়েছে!", Toast.LENGTH_SHORT).show()
                      }
                  }

                  val permBtn = Button(this).apply {
                      text = "Notification Permission দিন"
                      setOnClickListener {
                          startActivity(Intent(Settings.ACTION_NOTIFICATION_LISTENER_SETTINGS))
                      }
                  }

                  layout.addView(statusSwitch)
                  layout.addView(apiKeyInput)
                  layout.addView(targetInput)
                  layout.addView(promptInput)
                  layout.addView(saveBtn)
                  layout.addView(permBtn)
                  scrollView.addView(layout)

                  setContentView(scrollView)
              }
          }
          EOF

          cat << 'EOF' > app/src/main/java/com/example/waautoreply/WhatsAppListener.kt
          package com.example.waautoreply

          import android.app.Notification
          import android.app.PendingIntent
          import android.app.RemoteInput
          import android.content.Context
          import android.content.Intent
          import android.os.Bundle
          import android.service.notification.NotificationListenerService
          import android.service.notification.StatusBarNotification
          import kotlinx.coroutines.*
          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          class WhatsAppListener : NotificationListenerService() {
              private val scope = CoroutineScope(Dispatchers.IO + SupervisorJob())
              private var lastMessage = ""

              override fun onNotificationPosted(sbn: StatusBarNotification) {
                  val pkg = sbn.packageName
                  if (pkg != "com.whatsapp" && pkg != "com.whatsapp.w4b") return

                  val prefs = getSharedPreferences("BotConfig", Context.MODE_PRIVATE)
                  if (!prefs.getBoolean("enabled", false)) return

                  val extras = sbn.notification.extras
                  val sender = extras.getString(Notification.EXTRA_TITLE) ?: return
                  val message = extras.getCharSequence(Notification.EXTRA_TEXT)?.toString() ?: return

                  if ((sbn.notification.flags and Notification.FLAG_GROUP_SUMMARY) != 0) return
                  if (message == lastMessage) return

                  val targets = prefs.getString("targets", "")
                      ?.split(",")
                      ?.map { it.trim().lowercase() }
                      ?.filter { it.isNotEmpty() } ?: return

                  val isTarget = targets.any { sender.lowercase().contains(it) }
                  if (!isTarget) return

                  val replyAction = findReplyAction(sbn.notification) ?: return
                  val apiKey = prefs.getString("apiKey", "") ?: return
                  val sysPrompt = prefs.getString("systemPrompt", "") ?: ""

                  if (apiKey.isEmpty()) return
                  lastMessage = message

                  scope.launch {
                      delay(3000)
                      val aiReply = fetchGeminiReply(apiKey, sysPrompt, sender, message)
                      if (aiReply.isNotEmpty()) {
                          sendQuickReply(replyAction, aiReply)
                      }
                  }
              }

              private fun findReplyAction(notification: Notification): Notification.Action? {
                  val actions = notification.actions ?: return null
                  for (action in actions) {
                      val remoteInputs = action.remoteInputs ?: continue
                      for (input in remoteInputs) {
                          if (input.allowFreeFormInput) return action
                      }
                  }
                  return null
              }

              private fun fetchGeminiReply(apiKey: String, sysPrompt: String, sender: String, msg: String): String {
                  return try {
                      val url = URL("https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=$apiKey")
                      val conn = (url.openConnection() as HttpURLConnection).apply {
                          requestMethod = "POST"
                          setRequestProperty("Content-Type", "application/json")
                          doOutput = true
                      }

                      val fullPrompt = "$sysPrompt\n\nপ্রেরকের নাম: $sender\nমেসেজ: $msg\nউত্তর:"
                      val body = JSONObject().apply {
                          put("contents", JSONArray().put(JSONObject().apply {
                              put("parts", JSONArray().put(JSONObject().put("text", fullPrompt)))
                          }))
                      }

                      conn.outputStream.use { it.write(body.toString().toByteArray()) }

                      val response = conn.inputStream.bufferedReader().readText()
                      val json = JSONObject(response)
                      json.getJSONArray("candidates")
                          .getJSONObject(0)
                          .getJSONObject("content")
                          .getJSONArray("parts")
                          .getJSONObject(0)
                          .getString("text")
                          .trim()
                  } catch (e: Exception) {
                      ""
                  }
              }

              private fun sendQuickReply(action: Notification.Action, replyText: String) {
                  try {
                      val intent = Intent()
                      val bundle = Bundle()
                      for (input in action.remoteInputs) {
                          bundle.putCharSequence(input.resultKey, replyText)
                      }
                      RemoteInput.addResultsToIntent(action.remoteInputs, intent, bundle)
                      action.actionIntent.send(this, 0, intent)
                  } catch (e: PendingIntent.CanceledException) {
                      e.printStackTrace()
                  }
              }
          }
          EOF

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: WA-AI-AutoReply-APK
          path: app/build/outputs/apk/debug/app-debug.apk
